<!DOCTYPE html>
<html>
<head>
    <title>Todo</title>
    <style>
        :root {
            --bg-color: #080710;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --accent-purple: #7928ca;
            --accent-pink: #ff007f;
            --accent-cyan: #00f2fe;
            --glow-add: 0 0 25px rgba(255, 0, 127, 0.5);
            --glow-del: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            mix-blend-mode: screen;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }

        body::before {
            top: -50px;
            right: -50px;
            background: var(--accent-purple);
        }

        body::after {
            bottom: -50px;
            left: -50px;
            background: var(--accent-cyan);
            animation-delay: -4s;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 35px 0 15px 0;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, rgba(255, 255, 255, 0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        form {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 10px;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        form:focus-within {
            transform: scale(1.01);
            border-color: rgba(255, 255, 255, 0.2);
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: var(--accent-pink);
            background: rgba(0, 0, 0, 0.6);
        }

        #delTodo input:focus {
            border-color: #ef4444;
        }

        button {
            padding: 14px 28px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
        }

        button:active {
            transform: scale(0.95) !important;
        }

        #addTodo button {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
        }

        #addTodo button:hover {
            transform: translateY(-4px);
            box-shadow: var(--glow-add);
        }

        #delTodo button {
            background: linear-gradient(135deg, #ef4444, #991b1b);
        }

        #delTodo button:hover {
            transform: translateY(-4px);
            box-shadow: var(--glow-del);
        }

        .cont {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h2 {
            margin: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            animation: cardEntrance 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        h2:hover {
            transform: translateY(-2px) scale(1.01) !important;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
        }

        h2::before {
            content: attr(data-index);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--accent-cyan);
            border-radius: 10px;
            margin-right: 16px;
            font-size: 0.85rem;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 60px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .footer-link:hover {
            color: var(--accent-cyan);
            text-shadow: 0 0 12px var(--accent-cyan);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-30px, 30px) scale(1.1); }
        }
    </style>
</head>
<body>

    <h1>Добавить задачу</h1>
    <form id="addTodo">
        <input type="text" id="task" placeholder="Что нужно сделать?" required>
        <button type="submit">Добавить</button>
    </form>

    <h1>Удалить по индексу</h1>
    <form id="delTodo">
        <input type="number" id="index" placeholder="Номер задачи" required>
        <button type="submit">Удалить</button>
    </form>

    <div class="cont"></div>

    <a href="https://github.com/destrivate" target="_blank" class="footer-link">github.com/destrivate</a>

    <script>
        const addTodo = document.getElementById("addTodo");
        const delTodo = document.getElementById("delTodo");

        addTodo.addEventListener("submit", function(event){
            event.preventDefault();
            const task = document.getElementById("task").value;
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks.push(task);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            location.reload();
        });

        delTodo.addEventListener("submit", function(event){
            event.preventDefault();
            const indexTask = parseInt(document.getElementById("index").value, 10);
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            
            if (indexTask >= 0 && indexTask < tasks.length) {
                tasks.splice(indexTask, 1);
                localStorage.setItem("tasks", JSON.stringify(tasks));
            } else {
                alert("Задачи с таким индексом не существует!");
            }
            location.reload();
        });

        const tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        const contaner = document.querySelector(".cont");

        if (tasks.length !== 0) {
            for (let [index, task] of tasks.entries()){
                const newHeading = document.createElement('h2');
                newHeading.innerText = task; 
                newHeading.setAttribute('data-index', index); 
                newHeading.style.animationDelay = (index * 0.08) + 's';
                contaner.appendChild(newHeading);
            }
        } else {
            contaner.innerHTML = '<p style="color: rgba(255,255,255,0.2); text-align: center; margin-top: 20px; font-weight: 500;">Список задач пуст</p>';
        }
    </script>
</body>
</html>
